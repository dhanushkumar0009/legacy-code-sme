<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Legacy Code SME</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
      --text: #e6e8eb; --muted: #9aa3af;
      --confirmed: #3fb950; --inferred: #d29922; --stale: #f85149;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; display: flex;
    }
    .chat-col { flex: 2; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
    .memory-col { flex: 1; min-width: 280px; padding: 16px; overflow-y: auto; background: var(--panel); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 16px; margin: 0; }
    header p { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 14px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #0b1320; }
    .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
    .input-row { display: flex; gap: 8px; padding: 16px; border-top: 1px solid var(--border); }
    .input-row input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
    .input-row button { padding: 10px 18px; border-radius: 8px; border: none; background: var(--accent); color: #0b1320; font-weight: 600; cursor: pointer; }
    .input-row button:disabled { opacity: .5; cursor: default; }
    .memory-col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
    .entity-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .entity-card .name { font-weight: 600; font-size: 13px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 6px; }
    .badge.CONFIRMED { background: rgba(63,185,80,.15); color: var(--confirmed); }
    .badge.INFERRED { background: rgba(210,153,34,.15); color: var(--inferred); }
    .badge.STALE { background: rgba(248,81,73,.15); color: var(--stale); }
    .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .empty { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="chat-col">
    <header>
      <h1>Legacy Code SME</h1>
      <p>Ask about the codebase. Answers are labeled CONFIRMED / INFERRED / STALE.</p>
    </header>
    <div id="messages"></div>
    <div class="input-row">
      <input id="userName" placeholder="Your name" style="max-width:140px" value="Dev" />
      <input id="input" placeholder="e.g. What does ApplyLateFee do?" />
      <button id="send">Send</button>
    </div>
  </div>
  <div class="memory-col">
    <h2>What the agent remembers</h2>
    <div id="memories"><p class="empty">No entities tracked yet — ingest the sample repo first.</p></div>
  </div>

  <script>
    const API_BASE = window.LEGACY_SME_API_BASE || "";
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const userNameEl = document.getElementById("userName");
    const memoriesEl = document.getElementById("memories");

    let history = [];

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = content;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      addMessage("user", text);
      history.push({ role: "user", content: text });

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            user_name: userNameEl.value || "unknown reviewer",
            history,
          }),
        });
        const data = await res.json();
        addMessage("agent", data.reply || data.detail || "(no reply)");
        history.push({ role: "assistant", content: data.reply || "" });
      } catch (e) {
        addMessage("agent", "Error reaching backend: " + e.message);
      } finally {
        sendBtn.disabled = false;
        refreshMemories();
      }
    }

    async function refreshMemories() {
      try {
        const res = await fetch(`${API_BASE}/memories`);
        const data = await res.json();
        if (!data.entities || data.entities.length === 0) {
          memoriesEl.innerHTML = '<p class="empty">No entities tracked yet — ingest the sample repo first.</p>';
          return;
        }
        memoriesEl.innerHTML = data.entities.map(e => `
          <div class="entity-card">
            <div class="name">${e.entity}</div>
            <span class="badge ${e.badge}">${e.badge}</span>
            <div class="meta">
              ${e.validated_by ? "Validated by " + e.validated_by : "Not yet validated"}
              ${e.last_code_changed_at ? " · code seen " + new Date(e.last_code_changed_at * 1000).toLocaleString() : ""}
            </div>
          </div>
        `).join("");
      } catch (e) {
        memoriesEl.innerHTML = '<p class="empty">Could not reach backend.</p>';
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

    refreshMemories();
    setInterval(refreshMemories, 8000);
  </script>
</body>
</html>
